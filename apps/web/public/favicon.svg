<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Amber">
  <title>Amber</title>
  <!--
    A hexagon drawn as three separate arcs, around a smaller hexagon of the
    same shape. The core repeating the outer shape is the amber itself: what
    it holds is kept in the form it went in. The enclosure being several
    pieces is that the space exists because people gather to make it, and the
    gaps are where someone new is let in. The top arc differs in colour
    because those people are not interchangeable.

    Colours are set twice: as attributes, which every renderer honours, and
    again in CSS so the mark can follow the browser theme where that is
    supported. Note that this file is XML, so comments cannot contain a
    double hyphen.
  -->
  <style>
    .base { stroke: #B87514 }
    .core { fill: #B87514 }
    .accent { stroke: #0CA678 }
    @media (prefers-color-scheme: dark) {
      .base { stroke: #F0B04A }
      .core { fill: #F0B04A }
      .accent { stroke: #2DD4A7 }
    }
  </style>
  <g fill="none" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path class="accent" stroke="#0CA678" d="M7.75 27V18L32 4l7.8 4.5"/>
    <path class="base" stroke="#B87514" d="M48.46 13.5 56.25 18v28l-7.79 4.5"/>
    <path class="base" stroke="#B87514" d="M39.8 55.5 32 60 7.75 46V37"/>
  </g>
  <path class="core" fill="#B87514" d="M32 21.5 41.1 26.75v10.5L32 42.5l-9.1-5.25v-10.5Z"/>
</svg>
