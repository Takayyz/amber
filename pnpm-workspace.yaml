packages:
  - "apps/*"
  - "packages/*"

# Pre-approve build scripts for packages that need them: `workerd` downloads
# the platform binary and `esbuild` downloads/builds native bindings, both
# required by apps/api (Cloudflare Workers). Without these, pnpm 11+ aborts
# the install with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  workerd: true
